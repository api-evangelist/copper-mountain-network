name: Copper Mountain Network
description: Copper Mountain Networks was a telecommunications equipment maker founded in 1996 by Mark
  Handzel and Joe Markee that led the 1990s DSL (Digital Subscriber Line) wave in North America, building
  central-office DSL concentrators (the CopperEdge platform) and customer-premises modems that delivered
  high-speed broadband over existing copper telephone lines. The company was venture-backed by Canaan
  Partners and InterWest, held its IPO in 1999, weathered the telecom downturn of 2001, and was acquired
  by Tut Systems in 2005 (later absorbed into Motorola in 2007). It shipped hardware and network equipment,
  not a public web/developer API; the company is defunct and operates no live developer platform today.
